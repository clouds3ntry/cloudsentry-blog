name: Deploy Astro (pnpm) to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable pnpm via corepack (MOST STABLE METHOD)
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      # Setup Node.js (NO caching)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Disable workspace mode explicitly
      - name: Install dependencies
        run: |
          pnpm install --no-workspaces

      - name: Build Astro site
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
